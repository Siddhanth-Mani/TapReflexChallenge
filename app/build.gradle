plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.tapreflex.challenge'
    compileSdk 35

    defaultConfig {
        applicationId "com.tapreflex.challenge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
            }
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
}
